<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <div class="top-bar">
            <button id="musicButton">Music</button>
        </div>

        <input
            type="text"
            id="display"
            readonly
        >

        <div class="buttons">

            <button onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">←</button>
            <button onclick="addToDisplay('%')">%</button>
            <button class="operator" onclick="addToDisplay('/')">÷</button>

            <button onclick="addToDisplay('7')">7</button>
            <button onclick="addToDisplay('8')">8</button>
            <button onclick="addToDisplay('9')">9</button>
            <button class="operator" onclick="addToDisplay('*')">×</button>

            <button onclick="addToDisplay('4')">4</button>
            <button onclick="addToDisplay('5')">5</button>
            <button onclick="addToDisplay('6')">6</button>
            <button class="operator" onclick="addToDisplay('-')">−</button>

            <button onclick="addToDisplay('1')">1</button>
            <button onclick="addToDisplay('2')">2</button>
            <button onclick="addToDisplay('3')">3</button>
            <button class="operator" onclick="addToDisplay('+')">+</button>

            <button class="zero" onclick="addToDisplay('0')">0</button>
            <button onclick="addToDisplay('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

    </main>

    <audio id="backgroundMusic" loop>
        <source src="sounds/music.mp3" type="audio/mpeg">
    </audio>

    <audio id="clickSound">
        <source src="sounds/click.wav" type="audio/wav">
    </audio>

    <audio id="secretSound">
        <source src="sounds/secret.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>
</html>
